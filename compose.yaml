services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trend_radar}
      POSTGRES_USER: ${POSTGRES_USER:-trend_radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trend_radar_local_only}
      TZ: Asia/Karachi
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - trend-radar-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 1gb

volumes:
  trend-radar-postgres:

